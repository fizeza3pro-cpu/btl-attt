# /etc/systemd/system/dnsmasq.service.d/override.conf
# dnsmasq can card enp0s8 (mang lab) da san sang. Khi B khoi dong nhanh (vd tu khoi dong lai sau kernel panic),
# dnsmasq co the chay truoc khi card len -> "unknown interface enp0s8" -> dung han -> A/C khong xin duoc IP moi.
[Unit]
After=network-online.target sys-subsystem-net-devices-enp0s8.device
Wants=network-online.target
BindsTo=sys-subsystem-net-devices-enp0s8.device

[Service]
Restart=on-failure
RestartSec=5

# Site web cua lab tren may B - /etc/nginx/sites-available/lab
# Gioi han toc do (phong ngua, song song voi phat hien):
#   dang nhap: 10 request/phut/IP (burst 5)   API chung: 30 request/giay/IP (burst 60)
limit_req_zone $binary_remote_addr zone=lab_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lab_api:1m rate=30r/s;
limit_req_status 429;

server {
    listen 80 default_server;
    # Giu IPv6 co chu dich: dung de kiem chung rui ro lach chan qua IPv6, xu ly o tang mang.
    listen [::]:80 default_server;

    server_name _;
    root /var/www/lab;
    index index.html;

    access_log /var/log/nginx/access.log;

    # Khong cho trinh duyet dung ban luu cu: moi lan tai trang phai hoi lai may chu
    # (truoc day trang lay tu cache nen khi bi firewall chan van "trong nhu binh thuong").
    add_header Cache-Control "no-cache" always;
    # Header bao mat (trang co script noi tuyen nen script-src can 'unsafe-inline' - ghi nhan la diem can cai thien)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    location = /api/login {
        limit_req zone=lab_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2k;
    }

    # Honeypot (127.0.0.1:8082): API quan tri gia va file sao luu gia (honeytoken)
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /backup/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API cua Lab Shop (backend Python tren 127.0.0.1:8081)
    location /api/ {
        limit_req zone=lab_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        client_max_body_size 4k;
    }

    location = /robots.txt { }

    # Duong dan moi: /admin (trang quan tri gia cua Lab Shop) va /lab-admin (ten cu, giu cho so lieu M1-M5).
    # Dong bo voi rule SID 1000002 (pcre ^/(?:lab-)?admin(?:[/?]|$)); KHONG khop /administrator, /lab-administrator.
    location ~ ^/(lab-)?admin(/|$) {
        return 403;
    }

    error_page 403 /403.html;
    location = /403.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

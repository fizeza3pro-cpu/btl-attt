# Ban sao Lab Shop dung de DANH LUA (cong 8083) - /etc/nginx/sites-available/honeypot
# Ke tan cong bi analyzer dua vao set "deceive" se duoc nftables chuyen huong cong 80 -> 8083.
# Trong mat ke tan cong moi thu nhu cu, nhung /admin la trang dang nhap GIA va moi request duoc ghi rieng.
server {
    listen 8083;
    server_name _;
    root /var/www/lab;
    index index.html;
    access_log /var/log/nginx/honeypot-access.log;
    add_header Cache-Control "no-cache" always;

    location /admin { proxy_pass http://127.0.0.1:8082; proxy_set_header X-Real-IP $remote_addr; }
    location /lab-admin { proxy_pass http://127.0.0.1:8082/admin; proxy_set_header X-Real-IP $remote_addr; }
    location /api/admin/ { proxy_pass http://127.0.0.1:8082; proxy_set_header X-Real-IP $remote_addr; }
    location /backup/ { proxy_pass http://127.0.0.1:8082; proxy_set_header X-Real-IP $remote_addr; }
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location / { try_files $uri $uri/ =404; }
}
